<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-labelledby="title">
  <title id="title">Fullstack Tech</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Fullstack icon -->
  <rect x="10" y="10" width="120" height="120" rx="26" fill="url(#bg)"/>
  <path d="M58 40 34 70l24 30" fill="none" stroke="#fff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m82 40 24 30-24 30" fill="none" stroke="#fff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m78 34-16 72" fill="none" stroke="#fff" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Brand text -->
  <text x="155" y="70" font-family="Arial, Helvetica, sans-serif"
        font-size="48" font-weight="700" fill="#172033">Fullstack</text>
  <text x="155" y="111" font-family="Arial, Helvetica, sans-serif"
        font-size="34" font-weight="700" letter-spacing="5" fill="#2563eb">TECH</text>
</svg>